[project]
name = "study-planner-api"
version = "0.1.0"
description = "API to generate study plans and assessments for students using AI agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "aio-pika==9.6.2",
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "dependency-injector==4.49.1",
  "exa-py==2.14.0",
  "fastapi[standard]==0.139.0",
  "langchain-openai>=1.3.4",
  "langsmith>=0.9.1",
  "psycopg2-binary>=2.9.13",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pyjwt[crypto]==2.13.0",
  "python-dotenv==1.2.2",
  "sqlalchemy[asyncio]==2.0.51",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["returns.contrib.mypy.returns_plugin"]

[tool.ruff]
# Sets the indentation style for both linting rules and the formatter
indent-width = 2


[tool.ruff.format]
# Enforces spaces instead of tabs
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"

[tool.fastapi]
entrypoint = "src.main:app"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "returns>=0.29.0",
  "ruff>=0.16.10",
]
